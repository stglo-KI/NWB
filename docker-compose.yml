services:
  db:
    image: postgres:15-alpine
    container_name: nahwaerme-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-in-production}
      POSTGRES_DB: nahwaerme
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: nahwaerme-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-change-me-in-production}@db:5432/nahwaerme
      NEXTAUTH_URL: https://nwb.primotus.de
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      N8N_API_KEY: ${N8N_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nwb.rule=Host(`nwb.primotus.de`)"
      - "traefik.http.routers.nwb.entrypoints=websecure"
      - "traefik.http.routers.nwb.tls.certresolver=letsencrypt"
      - "traefik.http.services.nwb.loadbalancer.server.port=3000"

volumes:
  postgres_data:

networks:
  default:
    name: nahwaerme-network
